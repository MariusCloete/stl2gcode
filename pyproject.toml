[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stl2gcode"
version = "0.1.0"
description = "Convert STL files to G-code for CNC machining"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
stl2gcode = "stl_to_gcode:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stl2gcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
